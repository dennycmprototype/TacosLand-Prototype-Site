<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TacosLand — Kent, WA · That first bite changes everything.</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="colors_and_type.css">
  <style>
    html, body { margin: 0; padding: 0; }
    body { background: var(--masa-cream); color: var(--adobe-brown); font-family: var(--font-body); }
    #app { position: relative; min-height: 100vh; }
    /* paper grain */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(rgba(196,97,58,0.06) 1px, transparent 1px),
        radial-gradient(rgba(59,35,20,0.04) 1px, transparent 1px);
      background-size: 6px 6px, 13px 13px;
      background-position: 0 0, 3px 7px;
      opacity: 0.55;
    }
    #app > * { position: relative; }
    a { color: inherit; }
    /* Range input thumb tweak */
    input[type="range"] { height: 6px; }
    /* Responsive nav */
    @media (max-width: 980px) {
      .nav-cater { display: none !important; }
      .nav-cart-btn { padding: 10px 16px !important; font-size: 12px !important; }
    }
    @media (max-width: 820px) {
      .nav-links { display: none !important; }
      .nav-phone { display: none !important; }
      .nav-cater { display: none !important; }
      .nav-hamburger { display: flex !important; }
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    /* Tablet */
    @media (max-width: 900px) {
      .menu-layout { grid-template-columns: 1fr !important; }
      .menu-cart { position: static !important; }
      .footer-grid { grid-template-columns: 1fr 1fr !important; gap: 28px !important; }
    }

    /* Mobile */
    @media (max-width: 760px) {
      .hero-grid, .preview-grid, .reviews-header, .reviews-grid, .catering-grid, .loc-grid,
      .story-grid, .believe-grid, .cater-hero, .why-grid, .form-row,
      .contact-grid, .checkout-grid, .story-photos {
        grid-template-columns: 1fr !important;
      }
      h1, h2 { word-break: break-word; }
      .hero-grid, .catering-grid, .loc-grid, .cater-hero,
      .story-grid, .reviews-header, .contact-grid, .checkout-grid {
        gap: 24px !important;
      }
      .hero-grid > * { grid-column: 1 !important; grid-row: auto !important; }
      .hero-image { max-width: 100% !important; }
      .reviews-grid, .believe-grid, .why-grid, .preview-grid {
        gap: 16px !important;
      }
      /* Reduce section padding on mobile */
      .mobile-section { padding-left: 16px !important; padding-right: 16px !important; }
      /* Touch targets */
      .nav-mobile-menu a { padding-top: 14px !important; padding-bottom: 14px !important; }
    }

    /* Small phone */
    @media (max-width: 480px) {
      .preview-grid { grid-template-columns: 1fr !important; }
      .menu-grid { grid-template-columns: 1fr !important; }
      .footer-grid { grid-template-columns: 1fr !important; }
      .story-photos { grid-template-columns: 1fr !important; }
    }

    @media (min-width: 481px) and (max-width: 760px) {
      .preview-grid { grid-template-columns: 1fr 1fr !important; }
      .menu-grid { grid-template-columns: 1fr 1fr !important; }
    }

    @media (min-width: 761px) {
      .menu-grid { grid-template-columns: 1fr 1fr !important; }
    }

    /* Smooth scroll + reduced-motion guard */
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app"></div>

  <script type="text/babel" src="Components.jsx"></script>
  <script type="text/babel" src="Home.jsx"></script>
  <script type="text/babel" src="Menu.jsx"></script>
  <script type="text/babel" src="Order.jsx"></script>
  <script type="text/babel" src="Story.jsx"></script>
  <script type="text/babel" src="Catering.jsx"></script>
  <script type="text/babel" src="Contact.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    function App() {
      const [route, setRoute] = useState(() => {
        const h = (location.hash || '').replace('#', '');
        return ['home','menu','catering','story','contact','order'].includes(h) ? h : 'home';
      });
      const [cart, setCart] = useState([]);

      // Persist route in hash so refresh keeps the page
      useEffect(() => {
        if (location.hash.replace('#', '') !== route) {
          history.replaceState(null, '', '#' + route);
        }
        window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
      }, [route]);

      const addToCart = (it) => {
        setCart(prev => {
          const ex = prev.find(p => p.id === it.id);
          if (ex) return prev.map(p => p.id === it.id ? { ...p, qty: p.qty + 1 } : p);
          return [...prev, { ...it, qty: 1 }];
        });
      };
      const place = () => setCart([]);

      const cartCount = cart.reduce((s, c) => s + c.qty, 0);
      const { Nav, Footer } = window.TLC;

      const labels = {
        home: '01 Home', menu: '02 Menu', catering: '03 Catering',
        story: '04 Our story', contact: '05 Contact', order: '06 Checkout',
      };
      return (
        <div data-screen-label={labels[route] || route}>
          <Nav active={route} onNavigate={setRoute} cartCount={cartCount} />
          {route === 'home'     && <window.TLHome     onNavigate={setRoute} onAddSpecial={addToCart} />}
          {route === 'menu'     && <window.TLMenu     cart={cart} onAdd={addToCart} onNavigate={setRoute} />}
          {route === 'catering' && <window.TLCatering onNavigate={setRoute} />}
          {route === 'story'    && <window.TLStory    onNavigate={setRoute} />}
          {route === 'contact'  && <window.TLContact  onNavigate={setRoute} />}
          {route === 'order'    && <window.TLOrder    cart={cart} onNavigate={setRoute} onPlace={place} />}
          <Footer onNavigate={setRoute} />
        </div>
      );
    }

    const tryMount = () => {
      if (window.TLC && window.TLHome && window.TLMenu && window.TLOrder && window.TLStory && window.TLCatering && window.TLContact) {
        ReactDOM.createRoot(document.getElementById('app')).render(<App />);
      } else {
        setTimeout(tryMount, 30);
      }
    };
    tryMount();
  </script>
</body>
</html>
